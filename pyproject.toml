[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brain-local"
version = "0.1.0"
description = "Local project ingestion, evidence preservation and selective knowledge retrieval"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# 6.12 passed the UI assertions but aborted during Python 3.11 shutdown in CI.
desktop = ["PySide6==6.11.2"]

[project.scripts]
brain = "brain.__main__:main"
brain-desktop = "brain.desktop:main"

[tool.setuptools]
packages = ["brain"]
